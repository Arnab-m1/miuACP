name: C/C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
    
    - name: Configure with CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release 2>&1 | head -50
    
    - name: List available targets
      run: |
        cd build
        make help | grep -E "^\.\.\.|^[a-z]" | head -20
    
    - name: Build library
      run: |
        cd build
        make miuacp_static -j$(nproc)
    
    - name: Build examples (if available)
      run: |
        cd build
        make basic_usage -j$(nproc) 2>&1 || echo "Example build failed or not available"
      continue-on-error: true
    
    - name: Build tests (if available)
      run: |
        cd build
        make test_basic -j$(nproc) 2>&1 || echo "Test build failed or not available"
      continue-on-error: true
    
    - name: Run tests
      run: |
        cd build
        if [ -f bin/test_basic ]; then
          ./bin/test_basic
        elif [ -f test_basic ]; then
          ./test_basic
        else
          echo "No test executable found, skipping tests"
        fi
      continue-on-error: true

  build-makefile:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    
    - name: Build with Makefile
      run: make library
    
    - name: Build examples
      run: make examples
    
    - name: Build tests
      run: make tests
    
    - name: Run tests
      run: make test-all

