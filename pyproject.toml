[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miuacp"
version = "1.0.0"
description = "µACP: A lightweight agent communication protocol for edge-native multi-agent systems"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Arnab", email = "hello@arnab.wiki"}
]
maintainers = [
    {name = "Arnab", email = "hello@arnab.wiki"}
]
keywords = [
    "agent", "communication", "protocol", "micro", "lightweight", "edge", "iot",
    "multi-agent", "distributed", "messaging", "pubsub", "rpc", "robustness",
    "circuit-breaker", "timeout", "resource-pool", "health-monitoring"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.8"
dependencies = [
    "cbor2>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]
full = [
    "prometheus-client>=0.17.0",
    "paho-mqtt>=1.6.1",
    "aiocoap>=0.4.7",
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/Arnab-m1/miuACP"
Documentation = "https://github.com/Arnab-m1/miuACP#readme"
Repository = "https://github.com/Arnab-m1/miuACP"
"Bug Tracker" = "https://github.com/Arnab-m1/miuACP/issues"
Changelog = "https://github.com/Arnab-m1/miuACP/blob/main/CHANGELOG.md"

[project.scripts]
uacp-agent = "miuacp.cli:main"
uacp-client = "miuacp.client:main"
uacp-server = "miuacp.server:main"

[tool.setuptools]
packages = ["miuacp"]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
miuacp = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["miuacp"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=miuacp",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
